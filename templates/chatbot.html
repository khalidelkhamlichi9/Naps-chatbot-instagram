<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAPS · Messages</title>
<meta name="description" content="Chat avec l'assistant NAPS.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/static/js/marked.min.js?v=1.0.1"></script>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --naps-orange: #e25200;
    --naps-orange-light: #ff6a1a;
    --naps-grad: linear-gradient(135deg, #e25200, #ff6a1a);
    --sent-bg: var(--naps-grad);
    --recv-bg: #F2F2F2;
    --recv-text: #404040;
    --sent-text: #fff;
    --bg: #fff;
    --border: #EEEEEE;
    --muted: #8E8E8E;
    --black: #404040;
    --header-h: 64px;
    --input-h: 72px;
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Helvetica', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--black); overflow: hidden; }

  /* ── Shell ── */
  .shell {
    display: flex;
    height: 100vh;
    max-width: 960px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    height: var(--header-h);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    background: #fff;
    flex-shrink: 0;
    position: relative;
  }
  .back-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: none; background: transparent;
    cursor: pointer; color: var(--black); flex-shrink: 0;
    transition: background .15s;
  }
  .back-btn:hover { background: var(--recv-bg); }
  .back-btn svg { width: 20px; height: 20px; }

  /* gradient-ringed avatar */
  .avatar-wrap {
    position: relative; width: 42px; height: 42px; flex-shrink: 0;
  }
  .avatar-ring {
    position: absolute; inset: -2px; border-radius: 50%;
    background: var(--naps-grad); padding: 2px;
  }
  .avatar-ring-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
  }
  .avatar-img {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--naps-grad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
    font-family: 'Gotham', 'Helvetica', sans-serif; flex-shrink: 0;
  }
  .status-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #3FC935; border: 2px solid #fff;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-name { font-family: 'Gotham', sans-serif; font-weight: 700; font-size: 14px; color: var(--black); line-height: 1.3; }
  .header-status { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .header-actions { display: flex; align-items: center; gap: 4px; }
  .hdr-btn {
    width: 36px; height: 36px;
    border-radius: 50%; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--black); transition: background .15s;
  }
  .hdr-btn:hover { background: var(--recv-bg); }
  .hdr-btn svg { width: 22px; height: 22px; }

  /* ── Messages ── */
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 0; }

  /* Date separator */
  .date-sep {
    display: flex; align-items: center; justify-content: center;
    margin: 12px 0 8px;
  }
  .date-sep span {
    font-size: 12px; color: var(--muted); font-weight: 500;
    background: #fff; padding: 0 8px;
  }

  /* Message rows */
  .msg-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .msg-group.sent { align-items: flex-end; }
  .msg-group.recv { align-items: flex-start; flex-direction: column; }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.sent { flex-direction: row-reverse; }

  .msg-avatar-small {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--naps-grad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; color: #fff;
    flex-shrink: 0; margin-bottom: 2px;
  }
  .msg-avatar-small.hidden { visibility: hidden; }

  .bubble {
    max-width: 70%; padding: 10px 14px;
    font-size: 14px; line-height: 1.5;
    word-break: break-word; position: relative;
  }
  /* received */
  .bubble.recv {
    background: var(--recv-bg); color: var(--recv-text);
    border-radius: 20px 20px 20px 4px;
  }
  /* sent */
  .bubble.sent {
    background: var(--naps-grad); color: var(--sent-text);
    border-radius: 20px 20px 4px 20px;
  }
  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { padding-left: 18px; margin-bottom: 8px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { font-weight: 700; }
  .bubble a { color: inherit; text-decoration: underline; }
  /* tail tweaks for groups */
  .msg-group.recv .msg-row:not(:last-child) .bubble.recv { border-radius: 20px 20px 20px 4px; }
  .msg-group.sent .msg-row:not(:last-child) .bubble.sent { border-radius: 20px 20px 4px 20px; }

  .msg-time-reveal {
    font-size: 11px; color: var(--muted);
    padding: 2px 4px; text-align: center;
    max-height: 0; overflow: hidden; transition: max-height .2s;
  }
  .msg-group:hover .msg-time-reveal { max-height: 24px; }

  /* Seen indicator */
  .seen-row { display: flex; justify-content: flex-end; padding-right: 2px; margin-top: 2px; }
  .seen-avatar { width: 14px; height: 14px; border-radius: 50%; background: var(--ig-grad); }

  /* Typing indicator */
  .typing-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 4px; }
  .typing-bubble {
    background: var(--recv-bg); border-radius: 20px 20px 20px 4px;
    padding: 12px 16px; display: flex; align-items: center; gap: 4px;
  }
  .tdot {
    width: 7px; height: 7px; border-radius: 50%; background: #999;
    animation: tdot 1.3s infinite;
  }
  .tdot:nth-child(2) { animation-delay: .18s; }
  .tdot:nth-child(3) { animation-delay: .36s; }
  @keyframes tdot {
    0%, 60%, 100% { transform: translateY(0); opacity: .6; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Fade-in animation */
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg-group { animation: msgIn .2s ease; }

  /* ── Welcome ── */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; gap: 14px; text-align: center;
    padding: 40px 24px; animation: msgIn .3s ease;
  }
  .welcome-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--naps-grad);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 28px; color: #fff;
    box-shadow: 0 4px 20px rgba(226,82,0,.2);
  }
  .welcome h2 { font-family: 'Gotham', sans-serif; font-size: 18px; font-weight: 700; color: var(--black); }
  .welcome p { font-size: 13.5px; color: var(--muted); max-width: 280px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
  .chip {
    padding: 8px 16px; border-radius: 22px;
    border: 1px solid var(--border); background: #fff;
    font-size: 13px; font-family: inherit; cursor: pointer;
    color: var(--black); transition: all .15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .chip:hover { border-color: var(--naps-orange); color: var(--naps-orange); background: rgba(226,82,0,0.05); }

  /* ── Input bar ── */
  .input-bar {
    height: var(--input-h); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 14px; gap: 10px;
    background: #fff; flex-shrink: 0;
  }
  .input-icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: transparent; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
    color: var(--black); transition: background .15s;
  }
  .input-icon-btn:hover { background: var(--recv-bg); }
  .input-icon-btn.recording {
    color: #fff !important;
    background: #E1306C !important;
    animation: pulse-red 1.5s infinite;
  }
  .audio-bubble {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 140px;
  }
  .audio-content {
    display: flex; align-items: center; gap: 10px;
    font-weight: 500; font-size: 14px;
  }
  .audio-sub {
    font-size: 11px; opacity: 0.7; font-style: italic;
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 4px; margin-top: 2px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #E1306C; border-radius: 50%;
    animation: pulse-red 1s infinite;
  }
  @keyframes pulse-red {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }
  .input-icon-btn svg { width: 24px; height: 24px; }

  .input-pill {
    flex: 1; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 22px;
    padding: 8px 14px; background: #fff; transition: border .2s;
  }
  .input-pill:focus-within { border-color: #999; }
  #msg-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--black);
    resize: none; max-height: 100px; line-height: 1.45;
  }
  #msg-input::placeholder { color: var(--muted); }

  .emoji-btn {
    width: 28px; height: 28px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px; flex-shrink: 0; opacity: .7;
    transition: opacity .15s;
  }
  .emoji-btn:hover { opacity: 1; }

  /* Send / like toggle */
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: transparent; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
    transition: all .18s; padding: 0;
  }
  .send-btn .icon-send { display: none; }
  .send-btn .icon-like { display: flex; font-size: 24px; line-height: 1; }
  .send-btn.active .icon-send { display: flex; }
  .send-btn.active .icon-like { display: none; }
  .send-btn svg { width: 26px; height: 26px; fill: none; }
  /* gradient on send icon */
  .send-btn.active svg { stroke: var(--naps-orange); stroke-width: 2; }

  /* hidden SVG defs for gradient stroke */
  svg.defs-only { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>

<!-- Gradient defs for send icon -->
<svg class="defs-only" aria-hidden="true">
  <defs>
    <linearGradient id="ig-grad-stroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1306C"/>
      <stop offset="50%" stop-color="#833AB4"/>
      <stop offset="100%" stop-color="#405DE6"/>
    </linearGradient>
  </defs>
</svg>

<div class="shell">

  <!-- ── Header ── -->
  <header class="header">
    <a href="/admin/dashboard" class="back-btn" title="Retour au dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>

    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-ring-inner">
          <div class="avatar-img">N</div>
        </div>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="header-info">
      <div class="header-name">Assistant NAPS</div>
      <div class="header-status" id="hdr-status">Actif maintenant</div>
    </div>

    <div class="header-actions">
      <button class="hdr-btn" onclick="clearChat()" title="Nouvelle conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
        </svg>
      </button>
      <button class="hdr-btn" title="Informations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Messages ── -->
  <div class="messages" id="messages">

    <!-- Welcome screen -->
    <div class="welcome" id="welcome-screen">
      <div class="avatar-img welcome-avatar">N</div>
      <h2>Assistant NAPS</h2>
      <p>Bonjour ! Je suis votre assistant intelligent. Comment puis-je vous aider aujourd'hui ?</p>
      <div class="chips">
        <button class="chip" onclick="sendChip(this)">Vos services</button>
        <button class="chip" onclick="sendChip(this)">Nous contacter</button>
        <button class="chip" onclick="sendChip(this)">Horaires</button>
        <button class="chip" onclick="sendChip(this)">À propos de NAPS</button>
      </div>
    </div>

  </div>

  <!-- ── Input bar ── -->
  <div class="input-bar">
    <button class="input-icon-btn" title="Appareil photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>

    <div class="input-pill">
      <textarea
        id="msg-input"
        rows="1"
        placeholder="Message…"
        oninput="onInput(this)"
        onkeydown="onKey(event)"
      ></textarea>
      <div id="voice-indicator" style="display:none; color: #E1306C; font-weight: 500; font-size: 14px; align-items:center; gap:8px;">
        <div class="pulse-dot"></div> Enregistrement…
      </div>
      <button class="emoji-btn" title="Emoji">😊</button>
    </div>

    <button class="input-icon-btn" id="voice-btn" onclick="toggleVoice()" title="Micro">
      <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Envoyer">
      <span class="icon-like">👍</span>
      <span class="icon-send">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </span>
    </button>

    <button class="send-btn" id="voice-send-btn" onclick="stopAndSendVoice()" title="Envoyer le vocal" style="display:none; background: #E1306C; color:#fff;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </button>
  </div>

</div>

<script>
const msgsEl  = document.getElementById('messages');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome-screen');
const hdrStatus = document.getElementById('hdr-status');
const voiceBtn  = document.getElementById('voice-btn');
const voiceSendBtn = document.getElementById('voice-send-btn');
const voiceIndicator = document.getElementById('voice-indicator');

let busy = false;
let recognition = null;
let isRecording = false;
let recordedText = "";

// Init Web Speech API
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'fr-FR';

  recognition.onstart = () => {
    isRecording = true;
    recordedText = "";
    voiceBtn.classList.add('recording');
    inputEl.style.display = 'none';
    voiceIndicator.style.display = 'flex';
    voiceSendBtn.style.display = 'flex';
    sendBtn.style.display = 'none';
  };

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        recordedText += event.results[i][0].transcript;
      }
    }
  };

  recognition.onend = () => {
    isRecording = false;
    voiceBtn.classList.remove('recording');
    inputEl.style.display = 'block';
    voiceIndicator.style.display = 'none';
    voiceSendBtn.style.display = 'none';
    sendBtn.style.display = 'flex';
  };
}

function toggleVoice() {
  if (!recognition) {
    alert("Désolé, votre navigateur ne supporte pas la reconnaissance vocale.");
    return;
  }
  if (isRecording) {
    stopVoice();
  } else {
    startVoice();
  }
}

function startVoice() {
  recognition.start();
}

function stopVoice() {
  recognition.stop();
}

async function stopAndSendVoice() {
  if (!isRecording) return;
  
  // Give it a small delay to catch the last words
  recognition.stop();
  
  setTimeout(async () => {
    const textToSend = recordedText.trim();
    if (!textToSend) {
      alert("Aucun son détecté. Réessayez !");
      return;
    }
    
    // Append audio bubble for effect
    appendGroup(textToSend, 'sent', true);
    
    // Process as a normal message
    await sendVoiceContent(textToSend);
  }, 300);
}

async function sendVoiceContent(msg) {
  busy = true;
  hdrStatus.textContent = 'en train d\'écrire…';
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, user_id: 'ui-user', stream: true })
    });
    
    removeTyping();
    
    if (!res.ok) {
      appendGroup(`Erreur ${res.status} — réessayez.`, 'recv');
    } else {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let bubble = null;
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') break;
            
            fullText += data;
            if (!bubble) {
              bubble = appendGroup("", 'recv');
            }
            bubble.innerHTML = marked.parse(fullText);
            scrollEnd();
          }
        }
      }
    }
  } catch (e) {
    removeTyping();
    appendGroup('Connexion impossible. Vérifiez le serveur.', 'recv');
  }

  hdrStatus.textContent = 'Actif maintenant';
  busy = false;
}

/* ── Helpers ── */
function ts() {
  return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function scrollEnd() { msgsEl.scrollTop = msgsEl.scrollHeight; }
function hideWelcome() { if (welcome) welcome.style.display = 'none'; }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function onInput(el) {
  autoResize(el);
  sendBtn.classList.toggle('active', el.value.trim().length > 0);
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

/* ── Build message group ── */
function appendGroup(text, role, isAudio = false) {
  hideWelcome();
  const group = document.createElement('div');
  group.className = `msg-group ${role}`;

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  if (role === 'recv') {
    const av = document.createElement('div');
    av.className = 'msg-avatar-small';
    av.textContent = 'N';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  
  if (isAudio) {
    bubble.classList.add('audio-bubble');
    bubble.innerHTML = `
      <div class="audio-content">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M12 3v18M8 8v8M16 8v8M4 11v2M20 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Message vocal</span>
      </div>
    `;
    if (text) {
       const sub = document.createElement('div');
       sub.className = 'audio-sub';
       sub.textContent = text;
       bubble.appendChild(sub);
    }
  } else if (role === 'recv') {
    bubble.innerHTML = marked.parse(text);
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  group.appendChild(row);
  
  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time-reveal';
  timeEl.textContent = ts();
  group.appendChild(timeEl);

  msgsEl.appendChild(group);
  scrollEnd();
  return bubble;
}

/* ── Typing indicator ── */
function showTyping() {
  hideWelcome();
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-row';

  const av = document.createElement('div');
  av.className = 'msg-avatar-small';
  av.textContent = 'N';

  const bbl = document.createElement('div');
  bbl.className = 'typing-bubble';
  bbl.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';

  row.appendChild(av);
  row.appendChild(bbl);
  msgsEl.appendChild(row);
  scrollEnd();
}
function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

/* ── Send ── */
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  // If send btn not active (like button pressed), send 👍
  const msg = sendBtn.classList.contains('active') ? text : '👍';

  busy = true;
  hdrStatus.textContent = 'en train d\'écrire…';
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.classList.remove('active');

  appendGroup(msg, 'sent');
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, user_id: 'ui-user', stream: true })
    });
    
    removeTyping();
    
    if (!res.ok) {
      appendGroup(`Erreur ${res.status} — réessayez.`, 'recv');
    } else {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let bubble = null;
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            let data = line.slice(6);
            if (data === '[DONE]') break;
            
            data = data.replaceAll('[NEWLINE]', '\n');
            fullText += data;
            if (!bubble) {
              bubble = appendGroup("", 'recv');
            }
            bubble.innerHTML = marked.parse(fullText);
            scrollEnd();
          }
        }
      }
    }
  } catch (e) {
    removeTyping();
    appendGroup('Connexion impossible. Vérifiez le serveur.', 'recv');
  }

  hdrStatus.textContent = 'Actif maintenant';
  busy = false;
  inputEl.focus();
}

function sendChip(btn) {
  inputEl.value = btn.textContent.trim();
  sendBtn.classList.add('active');
  sendMessage();
}

async function clearChat() {
  if (!confirm('Voulez-vous effacer toute la conversation ?')) return;
  
  try {
    await fetch('/chat/clear', { method: 'POST' });
    msgsEl.querySelectorAll('.msg-group, .typing-row, .date-sep').forEach(el => el.remove());
    if (welcome) welcome.style.display = '';
  } catch (e) {
    console.error('Failed to clear history:', e);
  }
}

// Like button (no text typed)
document.getElementById('send-btn').addEventListener('click', function() {
  if (!this.classList.contains('active')) {
    inputEl.value = '👍';
    sendBtn.classList.add('active');
    sendMessage();
  }
});

inputEl.focus();
</script>
