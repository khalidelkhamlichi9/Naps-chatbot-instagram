<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NAPS Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica', 'Inter', sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F8FA;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:rgba(226,82,0,0.04);top:-200px;right:-200px;pointer-events:none}
body::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(226,82,0,0.03);bottom:-150px;left:-150px;pointer-events:none}
.card{width:380px;background:#ffffff;border:1px solid #eeeeee;border-radius:20px;padding:40px;box-shadow: 0 10px 25px rgba(0,0,0,0.05);position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{width:44px;height:44px;background:#e25200;border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:22px;height:22px;fill:none;stroke:#ffffff;stroke-width:2}
.logo-text{font-family:'Gotham', 'Montserrat', sans-serif;font-weight:800;font-size:22px;color:#e25200}
.logo-sub{font-family:'Helvetica', sans-serif;font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase}
h2{font-family:'Gotham', 'Montserrat', sans-serif;font-weight:700;font-size:20px;color:#404040;margin-bottom:6px}
.subtitle{font-size:13.5px;color:#888;margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-family:'Helvetica', sans-serif;font-size:11.5px;font-weight:600;color:#404040;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
input{width:100%;background:#ffffff;border:1px solid #dddddd;border-radius:10px;padding:11px 14px;font-size:14px;color:#404040;font-family:inherit;outline:none;transition:border .2s}
input:focus{border-color:#e25200}
input::placeholder{color:#bbbbbb}
.btn-login{width:100%;padding:12px;background:#e25200;color:#ffffff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:'Gotham', 'Montserrat', sans-serif;cursor:pointer;margin-top:8px;transition:all .2s;letter-spacing:.3px}
.btn-login:hover{background:#ff6a1a;transform:translateY(-1px);box-shadow: 0 4px 12px rgba(226,82,0,0.2)}
.error{background:rgba(220,38,38,0.05);border:1px solid rgba(220,38,38,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#dc2626;margin-bottom:16px}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#bbbbbb}

/* Prevent browser autofill from breaking the design */
input:-webkit-autofill,
input:-webkit-autofill:hover, 
input:-webkit-autofill:focus, 
input:-webkit-autofill:active{
    -webkit-box-shadow: 0 0 0 30px white inset !important;
    -webkit-text-fill-color: #404040 !important;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </div>
    <div>
      <div class="logo-text">NAPS</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>

  <h2>Connexion</h2>
  <p class="subtitle">Accès réservé aux administrateurs</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/admin/login">
    <div class="form-group">
      <label>Identifiant</label>
      <input type="text" name="username" placeholder="admin" required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>Code MFA</label>
      <input type="text" name="mfa_code" placeholder="000000" autocomplete="one-time-code">
    </div>
    <button type="submit" class="btn-login">Se connecter</button>
  </form>

  <div class="footer">Chatbot NAPS — Astral Digital Agency</div>
</div>
</body>
</html>
